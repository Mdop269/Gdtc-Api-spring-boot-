# -- Master database for user authentication  --
spring.datasource.url=jdbc:postgresql://localhost:5432/mdop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# So we know how to build tenant DB URLs dynamically
#  e.g. "jdbc:postgresql://localhost:5432/"
spring.datasource.base-url=jdbc:postgresql://localhost:5432/

# --- Credentials we?ll use to connect each tenant?s DB as the same superuser OR "regular" user  ---
spring.datasource.tenant-username=postgres
spring.datasource.tenant-password=postgres

# ---- Super user DS for creating new databases ----
spring.super.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.super.datasource.username=postgres
spring.super.datasource.password=postgres
hibernate.hbm2ddl.auto=update
# Logging
#logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate=DEBUG

# We do not want Spring Boot auto-Flyway, so we exclude it
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# We still want multi-tenancy turned on, but we will wire it carefully
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.multiTenancy=DATABASE
spring.jpa.properties.hibernate.multi_tenant_connection_provider=com.GdtcApi.GdtcApi.config.MultiTenantConnectionProviderImpl
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.GdtcApi.GdtcApi.config.CurrentTenantIdentifierResolverImpl

